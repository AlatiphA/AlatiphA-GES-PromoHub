<html lang="en" class="adminRoot"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration | AlatiphA PromoHub</title><script src="./ui-theme.js"></script><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./admin.css"><link rel="stylesheet" href="./notifications.css"><link rel="stylesheet" href="./navigation.css"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">

<body class="adminPage"><header class="adminHeader"><div class="pageHeading"><a class="navControl" href="./index.html" aria-label="Back to PromoHub" title="Back to PromoHub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a><span>Administration</span></div><label class="uiAppearance">App appearance<select data-ui-theme-choice aria-label="App appearance"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label></header>
<main class="adminShell"><h1>Administration</h1><p id="adminIdentity"></p><p id="adminAccess" role="status">Checking administrator access…</p><p id="securityMessage" role="status" aria-live="polite"></p><div id="securityControls">  <section id="securityAdmin" aria-label="Administration" hidden>
    <h3>Administration</h3><p id="securitySummary"></p>
    <nav class="securityAdminNavigation" aria-label="Administration views"><button data-security="overview" aria-pressed="false">Overview</button><button type="button" data-security="quizzes">Practice tests</button><button type="button" data-security="questionReports">Question reports</button><button type="button" data-security="pushSettings">Push setup</button><button data-security="users" aria-pressed="false">Users</button><button data-security="payments" aria-pressed="false">Subscription payments</button><button data-security="messages" aria-pressed="false">Messages</button><button data-security="audit" aria-pressed="false">Recent audit</button></nav>
    <form id="securityUserFilters" class="securityUserFilters" hidden>
      <label class="securityUserSearchLabel">Search users<input id="securityUserSearch" type="search" maxlength="100" placeholder="Name or email prefix" autocomplete="off"></label>
      <label>Search in<select id="securityUserSearchField"><option value="name">Name</option><option value="email">Email</option></select></label>
      <label>Profile tier<select id="securityUserTier"><option value="all">All tiers</option><option value="premium">Premium profiles</option><option value="free">Free profiles</option></select></label>
      <label>Account status<select id="securityUserStatus"><option value="all">All statuses</option><option value="active">Active</option><option value="suspended">Suspended</option><option value="disabled">Disabled</option></select></label>
      <div class="securityActions"><button type="submit">Search / Apply</button><button id="securityUserClear" type="button">Clear filters</button></div>
      <p class="securityUserFilterHint">Results update as you type, after a short pause. Search is case-insensitive and matches the start of the selected name or email. Premium profile tier includes expired subscriptions.</p>
    </form>
    <h4 id="securityRecordsTitle">Choose a view above</h4><div id="securityRecords" aria-live="polite"></div>
    <div id="securityPagination" hidden><button id="securityPreviousPage" data-security="previous" disabled>Previous page</button><span id="securityPageLabel" role="status"></span><button id="securityNextPage" data-security="more" disabled>Next page</button></div>
  </section></div></main>
